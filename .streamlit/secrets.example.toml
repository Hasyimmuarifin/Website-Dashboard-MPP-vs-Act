# Contoh saja. Untuk lokal: salin menjadi .streamlit/secrets.toml.
# Untuk hosting: tempel konfigurasi yang sudah diisi ke Advanced settings > Secrets.
# Jangan unggah private key asli ke GitHub atau chat.

[google_sheets]
# Boleh ID saja atau URL lengkap spreadsheet hasil konversi ke Google Sheets.
spreadsheet_id = "GANTI_DENGAN_SPREADSHEET_ID"
worksheet = "template bider (okt)"

[gcp_service_account]
type = "service_account"
project_id = "GANTI_DENGAN_PROJECT_ID"
private_key_id = "GANTI_DENGAN_PRIVATE_KEY_ID"
# Isi blok berikut dengan private_key asli dari JSON, termasuk baris BEGIN/END.
# Baris baru asli dianjurkan. Adapter juga merapikan \n literal dan baris PEM
# yang menyatu saat disalin dari JSON; isi private key tetap harus lengkap.
private_key = '''
-----BEGIN PRIVATE KEY-----
GANTI_DENGAN_ISI_PRIVATE_KEY
-----END PRIVATE KEY-----
'''
client_email = "nama-service-account@project-id.iam.gserviceaccount.com"
client_id = "GANTI_DENGAN_CLIENT_ID"
token_uri = "https://oauth2.googleapis.com/token"
