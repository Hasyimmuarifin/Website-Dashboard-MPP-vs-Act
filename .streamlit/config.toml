# Light blue corporate theme; use a darker blue for legible button text.
[theme]
base = "light"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["1.9rem", "1.5rem", "1.15rem", "1rem", "0.95rem", "0.875rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "2.25rem"
metricValueFontWeight = 650
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"
paddingBottom = "2rem"

primaryColor = "#1976D2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F7FE"
textColor = "#173653"
borderColor = "#CFE4F7"
linkColor = "#1565C0"
blueColor = "#2196F3"
greenColor = "#16815D"
redColor = "#C62828"
dataframeHeaderBackgroundColor = "#E3F2FD"
dataframeHeaderTextColor = "#174C7D"
chartCategoricalColors = ["#90CAF9", "#2196F3"]

[theme.sidebar]
paddingTop = "0.5rem"
paddingBottom = "1.5rem"
headingFontSizes = ["1.4rem", "1.2rem", "1.1rem", "1rem", "0.95rem", "0.875rem"]
backgroundColor = "#EFF7FE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#173653"
borderColor = "#C5DFF5"
